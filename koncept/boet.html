<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Boet — konceptscen</title>
<style>
  :root{
    --cream:#f4ede1; --sand:#e0d0bc; --clay:#c9785e; --honey:#d7a85f;
    --gron:#7fa07f; --petrol:#4e7f8a; --forest:#35584a; --camel:#c4a678;
    --espresso:#2a2520; --natt:#1c2620;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#2a2119}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--cream)}
  #duk{position:fixed;inset:0;display:block}
  .lager{position:fixed;inset:0;pointer-events:none}

  /* Toppraden: vems bo, nivå, fjädrar. Måttsatt mot iPad: siffrorna ska gå att läsa
     på en armlängds håll utan att äta halva bilden. */
  .topp{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
        gap:14px;padding:16px 22px;
        background:linear-gradient(180deg,rgba(26,20,15,.55),rgba(26,20,15,0))}
  .vem{font-size:30px;font-weight:600;letter-spacing:-.01em;
       text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .niva{font-size:19px;font-weight:600;padding:5px 14px;border-radius:999px;
        background:rgba(244,237,225,.16);border:1px solid rgba(244,237,225,.3)}
  .fjadrar{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:26px;
           font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .fjadrar svg{width:26px;height:26px}

  /* Knappen. HÅLL IN — inte tryck. Rörelsen är hela poängen enligt rad 536. */
  .knapp{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
         display:flex;align-items:center;gap:12px;
         padding:17px 34px;border-radius:999px;font-size:25px;font-weight:700;
         color:#2a2520;background:var(--honey);
         box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 -3px 0 rgba(0,0,0,.14);
         white-space:nowrap}
  .knapp .ring{position:absolute;inset:-6px;border-radius:999px;
               border:3px solid rgba(215,168,95,.85)}

  /* Den tunna raden nederst: Bills väg vidare utan att lämna scenen (rad 537). */
  .rad{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;
       gap:10px;padding:13px 16px 15px;
       background:linear-gradient(0deg,rgba(26,20,15,.7),rgba(26,20,15,0))}
  .rad div{font-size:19px;font-weight:600;padding:9px 20px;border-radius:12px;
           background:rgba(244,237,225,.12);border:1px solid rgba(244,237,225,.22)}
  .rad .nu{background:rgba(127,160,127,.28);border-color:rgba(127,160,127,.6)}

  /* Nivå-upp. Stor, kort, mitt i bilden. */
  .upp{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);text-align:center}
  .upp .stor{font-size:74px;font-weight:800;letter-spacing:-.03em;
             text-shadow:0 6px 26px rgba(0,0,0,.65)}
  .upp .xp{font-size:29px;font-weight:700;color:var(--honey);margin-top:2px;
           text-shadow:0 3px 14px rgba(0,0,0,.6)}

  /* Ägget: nedräkningen ska synas, inte anas. */
  .klocka{position:absolute;left:50%;transform:translateX(-50%);
          display:flex;align-items:center;gap:9px;
          padding:10px 20px;border-radius:999px;font-size:23px;font-weight:700;
          background:rgba(26,20,15,.62);border:1px solid rgba(244,237,225,.26);
          backdrop-filter:blur(3px)}
  .namn{position:absolute;left:50%;transform:translateX(-50%);
        padding:10px 22px;border-radius:999px;font-size:26px;font-weight:700;
        color:#2a2520;background:var(--cream);
        box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .gava{position:absolute;left:50%;transform:translateX(-50%);
        padding:11px 22px;border-radius:14px;font-size:23px;font-weight:700;
        color:#2a2520;background:var(--gron);
        box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .syskon{position:absolute;font-size:18px;font-weight:600;opacity:.85;
          text-shadow:0 2px 8px rgba(0,0,0,.7)}
  .vinjett{position:absolute;inset:0;
           box-shadow:inset 0 0 180px 40px rgba(20,14,10,.55)}
</style>
</head>
<body>
<canvas id="duk"></canvas>
<div class="lager" id="ui">
  <div class="topp">
    <span class="vem">Bills bo</span>
    <span class="niva" id="uNiva">Nivå 1</span>
    <span class="fjadrar">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2c4 3 5 9 2 14-1.6 2.7-4 4.6-7 6 .4-3.6 1.4-7 3-10" stroke="#d7a85f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 12c2-1 4-1.4 6-1.2" stroke="#d7a85f" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="uFjadrar">12</span>
    </span>
  </div>
  <div class="knapp" id="uKnapp"><span class="ring"></span><span id="uKnappText">HÅLL IN FÖR ATT LÄGGA I BOET</span></div>
  <div class="upp" id="uUpp"><div class="stor" id="uUppText">Nivå 3!</div><div class="xp">+30 XP</div></div>
  <div class="klocka" id="uKlocka">Ägget kläcks om <span id="uTid">58 min</span></div>
  <div class="namn" id="uNamn">Pip</div>
  <div class="gava" id="uGava">Pip ger dig 15 min</div>
  <div class="syskon" id="uSyskon">Tods bo</div>
  <div class="rad">
    <div class="nu">Boet</div><div>Skärmtid</div><div>Uppdrag</div><div>Butik</div>
  </div>
  <div class="vinjett"></div>
</div>

     reporoten: python3 -m http.server 5300 och öppna /koncept/boet.html -->

<script type="module" src="./boet.js"></script>
</body>
</html>
